#  =====================================================================
#  MOTIVA - Sprint 4 | Configuracao da aplicacao
#
#  Este arquivo substitui a classe db.ConexaoBD (o Singleton da Sprint 3).
#  Quem abre, reaproveita e fecha conexoes agora e o pool do Spring
#  (HikariCP), configurado por estas propriedades.
#  =====================================================================

spring.application.name=motiva-api
server.port=8080

#  ---------------------------------------------------------------------
#  Banco de dados - Oracle FIAP
#
#  ATENCAO: nenhuma credencial fica escrita aqui nem em codigo Java.
#  Usuario e senha sao lidos das variaveis de ambiente ORACLE_USER e
#  ORACLE_PASSWORD. Veja o README para saber como defini-las.
#
#  O formato da URL abaixo e o classico por SID:
#      jdbc:oracle:thin:@host:porta:SID
#  Se o seu laboratorio usar SERVICE_NAME em vez de SID, troque para:
#      jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL
#  ---------------------------------------------------------------------
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

#  Pool de conexoes gerenciado pelo framework
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=MotivaPool

#  ---------------------------------------------------------------------
#  JPA / Hibernate
#  ---------------------------------------------------------------------

#  none: o Hibernate NAO cria nem altera tabelas. As tabelas sao as que
#  voce mesmo modelou na Sprint 3 e migrou com os scripts de sql/.
#  Trocar para "validate" faz o Hibernate conferir, na subida, se o
#  mapeamento das entidades bate com o schema real - util uma vez, para
#  provar que a migracao ficou correta.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

#  Mostra no console o SQL que o Spring Data gerou a partir dos nomes dos
#  metodos dos Repository. E a forma mais direta de responder a pergunta
#  4 do enunciado: "onde esta o SQL do findByTipo()?"
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#  Mantem a sessao do JPA restrita a camada de servico. Sem isso, consultas
#  preguicosas poderiam disparar durante a serializacao do JSON, fora de
#  qualquer transacao - um efeito colateral dificil de rastrear.
spring.jpa.open-in-view=false

#  ---------------------------------------------------------------------
#  JSON
#  ---------------------------------------------------------------------
#  Datas no formato ISO-8601 (2026-10-09T14:30:00) em vez de array numerico.
#  O Spring Boot 4 usa o Jackson 3, em que as opcoes de data/hora passaram a
#  viver sob spring.jackson.datatype.datetime (no Jackson 2 era
#  spring.jackson.serialization).
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

#  ---------------------------------------------------------------------
#  Logs
#  ---------------------------------------------------------------------
logging.level.br.com.motiva=INFO
#  Descomente a linha abaixo para ver tambem os parametros enviados ao banco
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
