#  =====================================================================
#  Perfil "demo" - banco H2 em memoria
#
#  Serve para demonstrar a API sem depender do Oracle da FIAP: util para
#  gravar evidencias, testar no Postman ou mostrar o projeto em uma maquina
#  que nao tem o banco configurado.
#
#  Como usar:
#      mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#
#  ATENCAO: os dados vivem apenas enquanto a aplicacao esta no ar. O banco
#  oficial do projeto e o Oracle configurado em application.properties.
#  =====================================================================

spring.datasource.url=jdbc:h2:mem:motiva;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

#  Aqui o Hibernate CRIA o schema a partir das entidades, inclusive as
#  quatro sequences dos @SequenceGenerator. No perfil padrao (Oracle) isso
#  e "none", porque la as tabelas sao as da Sprint 3.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#  Console web do H2 em http://localhost:8080/h2-console
#  (JDBC URL: jdbc:h2:mem:motiva | usuario: sa | senha: em branco)
spring.h2.console.enabled=true
