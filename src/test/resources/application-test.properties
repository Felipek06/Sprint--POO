#  =====================================================================
#  Perfil de teste
#
#  A suite roda contra um H2 em memoria, em modo de compatibilidade Oracle.
#  Assim os testes de API nao dependem do banco da FIAP estar no ar nem das
#  variaveis ORACLE_USER / ORACLE_PASSWORD estarem definidas - e cada
#  execucao comeca com o banco limpo.
#  =====================================================================

spring.datasource.url=jdbc:h2:mem:motiva;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

#  Aqui, ao contrario da producao, o Hibernate CRIA o schema a partir das
#  entidades - inclusive as quatro sequences declaradas nos
#  @SequenceGenerator. Se algum mapeamento estiver errado, a suite nem sobe.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.br.com.motiva=WARN
logging.level.org.springframework.web=WARN
